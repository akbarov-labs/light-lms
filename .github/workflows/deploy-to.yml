name: Deploy to an environment

# One deploy, to whichever environment the caller names: deploy.yml calls it for staging, promote.yml for
# production (the public demo). Both run exactly the same steps; the only difference is which environment's
# key is used, and each key is pinned on the server to one app (sabaq-staging, sabaq).

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment: staging or production"
        required: true
        type: string
      image_tag:
        description: "Image tag (full commit SHA) built by deploy.yml"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # so GITHUB_TOKEN can pull the images on the VPS
      packages: read
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      # CI logs in as `deployer`, whose key can run exactly one thing on the server:
      # /usr/local/sbin/deploy-app <app> <tag> (forced command; deploy/server/deploy-app and docs/add-app.md
      # in akbarov-labs/reads). Whatever we send as the "command" arrives as the tag; the server checks it.
      # No checkout and no third-party action: nothing but this script touches the SSH key. The compose
      # files live on the server, root-owned. Server address, user and host key are repository variables
      # (this repository is private, so it cannot see the org's); only the key is a secret, per environment.
      - name: Deploy on the VPS
        env:
          CONTABO_USER: ${{ vars.CONTABO_USER }}
          CONTABO_HOST: ${{ vars.CONTABO_HOST }}
          CONTABO_PORT: ${{ vars.CONTABO_PORT }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_KNOWN_HOSTS: ${{ vars.CONTABO_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          for v in CONTABO_USER CONTABO_HOST CONTABO_KNOWN_HOSTS CONTABO_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set for the $DEPLOY_ENV environment (see DEPLOY.md, \"Our server\")"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$CONTABO_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$CONTABO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # registry login for the pull goes over stdin, never argv
          printf '%s\n%s\n' "$GH_ACTOR" "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${CONTABO_PORT:-22}" "$CONTABO_USER@$CONTABO_HOST" "$IMAGE_TAG"
