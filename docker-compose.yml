name: lms-light

x-app-env: &app-env
  DATABASE_URL: postgresql://lms:lms@db:5432/lms?schema=public
  AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  APP_URL: ${APP_URL:-http://localhost:3000}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AGENT_MODEL: ${AGENT_MODEL:-}
  # Bot API rich messages (report cards, payment/debt notices, attendance summary); off by default
  TELEGRAM_RICH_MESSAGES: ${TELEGRAM_RICH_MESSAGES:-false}
  # lesson times / payment dates shown in the reader's local time (Telegram date_time entities); off by default
  TELEGRAM_DATE_TIME: ${TELEGRAM_DATE_TIME:-false}
  # local stack: SMS rows are logged by the worker, never sent to a paid gateway (set false to send)
  SMS_DRY_RUN: ${SMS_DRY_RUN:-true}
  SEED_DEMO: ${SEED_DEMO:-true}
  DEMO_MODE: ${DEMO_MODE:-false}
  DEMO_URL: ${DEMO_URL:-}
  MAIN_SITE_URL: ${MAIN_SITE_URL:-}
  OPS_TELEGRAM_CHAT_ID: ${OPS_TELEGRAM_CHAT_ID:-}
  TZ: ${TZ:-Asia/Tashkent}
  DB_POOL_TIMEOUT_MS: ${DB_POOL_TIMEOUT_MS:-15000}

# worker liveness: the process touches this file every 30 s; older than 2 min = unhealthy
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/worker-heartbeat').mtimeMs < 120000 ? 0 : 1)"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: tools
    environment: *app-env
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed-if-empty.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    environment:
      <<: *app-env
      # true only behind a reverse proxy that sets X-Forwarded-For (otherwise clients could fake their IP)
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    init: true
    # localhost only by default; WEB_BIND=0.0.0.0 in .env to open it to the LAN (e.g. testing on a phone)
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-env
      # billing runs 4 syncs at a time + the notification queue + the bot: 10 is plenty
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-10}
    init: true
    # SIGTERM: finish the message in flight, stop the bot, up to 10 s
    stop_grace_period: 20s
    healthcheck: *worker-healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
