name: lms-light

x-app-env: &app-env
  DATABASE_URL: postgresql://lms:lms@db:5432/lms?schema=public
  AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  APP_URL: ${APP_URL:-http://localhost:3000}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  SEED_DEMO: ${SEED_DEMO:-true}
  PLATFORM_ADMIN_PHONES: ${PLATFORM_ADMIN_PHONES:-}
  DEMO_MODE: ${DEMO_MODE:-false}
  DEMO_URL: ${DEMO_URL:-}
  MAIN_SITE_URL: ${MAIN_SITE_URL:-}
  OPS_TELEGRAM_CHAT_ID: ${OPS_TELEGRAM_CHAT_ID:-}
  TZ: ${TZ:-Asia/Tashkent}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: tools
    environment: *app-env
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed-if-empty.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    environment: *app-env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      target: tools
    environment: *app-env
    command: ["npx", "tsx", "src/worker/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
